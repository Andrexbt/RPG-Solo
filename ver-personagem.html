<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ver Personagem</title>
    <link rel="stylesheet" href="tema.css" />
    <link rel="stylesheet" href="ficha-personagem.css" />
    <link rel="stylesheet" href="detalhes-ficha.css" />
    <link rel="stylesheet" href="ver-personagem.css" />

    <script src="acesso-area-mestre.js"></script>
    <script src="site-shell.js" defer></script>
  </head>

  <body class="site-com-rodape">
    <!-- =====================================================
         Cabeçalho da página
         ===================================================== -->
    <header class="cabecalho-site" data-site-header></header>

    <main class="pagina-ver-personagem">
      <!-- =====================================================
           Ações da ficha salva
           ===================================================== -->
      <!-- =====================================================
           Ficha do personagem carregado do localStorage
           -----------------------------------------------------
           Os valores são preenchidos por ver-personagem.js e
           pelas funções compartilhadas de ficha-personagem.js.
           ===================================================== -->
      <section class="layout-ficha-salva">
        <div class="cabecalho-ficha-salva">
          <h1>Ficha do personagem</h1>
          <div class="acoes-ficha-salva">
            <a class="botao botao-secundario" href="meus-personagens.html">Voltar para meus personagens</a>
            <button type="button" class="botao botao-principal" id="botaoBaixarPdfEditavel">Baixar PDF editável</button>
          </div>
        </div>
        <aside class="ficha-personagem-salva" data-ficha-personagem></aside>
      </section>
    </main>

    <footer class="rodape-site" data-site-footer></footer>

    <!-- =====================================================
         Modal compartilhada de detalhes da ficha
         ===================================================== -->
    <div id="modalDetalheFicha" class="modal-detalhe-ficha escondida">
      <div class="modal-detalhe-conteudo">
        <button type="button" id="botaoFecharModalDetalheFicha" class="botao-fechar-detalhe">
          Fechar
        </button>

        <h2 id="modalDetalheTitulo">Detalhes</h2>
        <p id="modalDetalheDescricao"></p>
        <div id="modalDetalheMecanica" class="modal-detalhe-mecanica"></div>
      </div>
    </div>

    <!-- =====================================================
         Scripts
         -----------------------------------------------------
         A ordem importa: bancos primeiro, componente compartilhado
         depois e controlador da página por último.
         ===================================================== -->
    <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>

    <script src="banco-pericias.js"></script>
    <script src="banco-idiomas.js"></script>
    <script src="banco-talentos.js"></script>
    <script src="banco-antecedentes.js"></script>
    <script src="banco-classes.js"></script>
    <script src="banco-equipamentos.js"></script>
    <script src="regras-equipamentos.js"></script>
    <script src="banco-maestrias.js"></script>
    <script src="banco-propriedades-armas.js"></script>
    <script src="banco-habilidades.js"></script>
    <script src="banco-magias.js"></script>
    <script src="banco-especies.js"></script>

    <script src="detalhes-ficha.js"></script>
    <script src="tradutor-regras.js"></script>
    <script src="ficha-personagem.js"></script>

    <script src="renderizador-ficha.js"></script>
    <script src="personagem-dados.js"></script>
    <script src="inicializador-pagina-ficha.js" data-controlador="ver-personagem.js"></script>
    <script src="transicoes-paginas.js"></script>
  </body>
</html>
