<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1">

  <title>A Fuga | RPG Solo</title>

  <link rel="stylesheet" href="aventuras.css">
</head>

<body>

  <div class="layout-aventura">

    <div class="coluna-lateral coluna-ficha">

      <button
      id="botaoRecolherFicha"
      class="botao-recolher-painel"
      type="button"
      aria-controls="painelFicha"
      aria-expanded="true"
      aria-label="Recolher ficha do personagem">Ficha
      </button>

      <aside
      id="painelFicha"
      class="painel-lateral painel-ficha">
      <h2>Ficha do personagem</h2>

      <div id="conteudoFicha">
        <p>A ficha será carregada aqui.</p>
      </div>

      </aside>

    </div>

    <main class="pagina-aventura">

      <div id="visualizacaoAventura" class="visualizacao-aventura">

        <header class="cabecalho-aventura">
      <p class="rotulo-aventura">RPG Solo</p>
      <h1 id="tituloAventura">A Fuga</h1>
        </header>

        <section
        class="cena-aventura"
        aria-labelledby="Cena da aventura">

        <div class="conteudo-cena">

          <div
          id="contextoCena"
          class="contexto-cena">
          Por algum motivo, você está fugindo da cidade onde viveu pelos últimos 4 anos.
          </div>

          <p
          id="solicitacaoTeste"
          class="solicitacao-teste"
          aria-live="polite"
          hidden>
          </p>

        </div>

        <div class="area-escolhas">

          <h3 id="tituloEscolhas">O que você fará?</h3>

          <div
          id="listaEscolhas"
          class="lista-escolhas">

          <!-- As escolhas serão inseridas pelo JavaScript. -->

          </div>

        </div>

        <div
          id="areaResultado"
          class="area-resultado"
          aria-live="polite"
          hidden>

          <p id="resultadoTeste"></p>

          <p id="consequenciaCena"></p>

        </div>

        </section>

        <section
        class="janela-acao"
        aria-labelledby="tituloAcao">

        <h2 id="tituloAcao">
          O que você fará?
        </h2>

        <form
            id="formularioAcao"
            class="formulario-acao">
        
            <textarea
            id="campoAcao"
            name="acao"
            rows="1"
            aria-label="Descreva a ação do personagem"
            placeholder=""
            required>
            </textarea>

            <button
            id="botaoEnviarAcao"
            type="submit">
            Enviar ação
            </button>
        
        </form>

        </section>

        <div class="ferramentas-aventura">

        <section
          class="janela-dados"
          aria-labelledby="tituloDados">

          <h2 id="tituloDados">
            Dados
          </h2>

          <div class="conteudo-dados">

            <form
              id="formularioDados"
              class="formulario-dados">

              <div
              id="listaGruposDados"
              class="lista-grupos-dados">

                <div class="grupo-dado">

                  <div class="campo-configuracao-dado">

                    <label>
                      <span>
                        Quantidade
                      </span>
                    

                      <input                 
                      class="quantidade-dados"
                      name="quantidade"
                      type="number"
                      min="1"
                      max="20"
                      value="1">

                    </label>

                  </div>

                  <div class="campo-configuracao-dado">

                  <label>
                    <span>
                      Dado
                    </span>
                  

                    <select
                      class="numero-de-faces"
                      name="numeroDeFaces">

                      <option value="4">d4</option>
                      <option value="6">d6</option>
                      <option value="8">d8</option>
                      <option value="10">d10</option>
                      <option value="12">d12</option>
                      <option value="20" selected>d20</option>
                      <option value="100">d100</option>

                    </select>

                  </label>

                  </div>

                </div>

              </div>

              <div class="campo-configuracao-dado">

                <label for="modificadorDados">
                Modificador
                </label>

                <input
                id="modificadorDados"
                name="modificador"
                type="number"
                value="0">

              </div>

              <button
              id="botaoAdicionarGrupoDado"
              type="button">
              Adicionar Dado
              </button>

              <button
              id="botaoRolarDado"
              type="button">
              Rolar
              </button>

            </form>

            <output
              id="resultadoDado"
              aria-live="polite">
            </output>

          </div>

        </section>

        <section
          class="janela-anotacoes"
          aria-labelledby="tituloAnotacoes">

          <h2 id="tituloAnotacoes">
            Anotações
          </h2>

          <textarea
            id="campoAnotacoes"
            rows="5"
            aria-labelledby="tituloAnotacoes"
            placeholder="Escreva suas anotações aqui...">
          </textarea>

        </section>

        </div>

      </div>
      
      <section
        id="visualizacaoCombate"
        class="visualizacao-combate"
        aria-label="Campo de combate"
        hidden>

        <div class="campo-combate">
          
          <div
          id="tabuleiroCombate"
          class="tabuleiro-combate"
          aria-label="Tabuleiro de combate">

            <button
            class="token-combate token-jogador"
            type="button"
            aria-label="Personagem do jogador">
            P
            </button>

            <button
            class="token-combate token-inimigo"
            type="button"
            aria-label="Inimigo">
            I
            </button>

          </div>

        </div>

      </section>

    </main>

    <div class="coluna-lateral coluna-explicativa">

      <button
      id="botaoRecolherPainelExplicativo"
      class="botao-recolher-painel"
      type="button"
      aria-controls="painelExplicativo"
      aria-expanded="true"
      aria-label="Recolher painel de informações">Informações
      </button>

      <aside
      id="painelExplicativo"
      class="painel-lateral painel-explicativo">

      <h2>Informações</h2>

      <div id="conteudoExplicativo">
        <p> As regras e explicações da situação aparecerão aqui. </p>
      </div>

      </aside>

    </div>

  </div>

  <script src="dados.js" defer></script>
  <script src="banco-pericias.js" defer></script>
  <script src="banco-npcs.js" defer></script>
  <script src="banco-aventuras.js" defer></script>
  <script src="estado-jogo.js" defer></script>
  <script src="testes.js" defer></script>
  <script src="combate.js" defer></script>
  <script src="aventuras.js" defer></script>
</body>
</html>
