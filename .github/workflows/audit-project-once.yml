name: Auditoria profunda temporária

on:
  push:
    branches:
      - main
    paths:
      - tools/audit-project-once.mjs

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Auditar referências e duplicidades
        run: node tools/audit-project-once.mjs
