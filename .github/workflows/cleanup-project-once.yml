name: Limpeza arquitetural temporária

on:
  push:
    branches:
      - main
    paths:
      - tools/cleanup-project-once.mjs

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Aplicar limpeza arquitetural
        run: node tools/cleanup-project-once.mjs

      - name: Verificar sintaxe JavaScript
        shell: bash
        run: |
          while IFS= read -r -d '' arquivo; do
            node --check "$arquivo"
          done < <(find . -type f -name "*.js" -not -path "./.git/*" -print0)

      - name: Validar HTML
        run: npx --yes html-validate@10.4.0 "*.html" "prototipos/**/*.html"

      - name: Registrar limpeza
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Nenhuma alteração foi necessária."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Limpeza profunda da arquitetura do projeto"
          git push origin HEAD:main
